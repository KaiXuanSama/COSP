spring:
  application:
    name: copilot-ollama-proxy
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:/app/data/admin.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-init-sql: PRAGMA foreign_keys = ON
  sql:
    init:
      mode: always

# ===== 服务器端口 =====
server:
  port: ${SERVER_PORT:11434}

admin:
  username: ${ADMIN_USERNAME:root}
  password: ${ADMIN_PASSWORD:root}

# ===== API Key 加密主密钥（必填） =====
# 环境变量：COSP_MASTER_KEY，任意 1-64 个字符，未配置时服务拒绝启动。

# ===== API 调用日志 =====
call-log:
  max-records: ${CALL_LOG_MAX_RECORDS:100}

# ===== Ollama 伪装版本 =====
ollama:
  version: ${OLLAMA_VERSION:0.6.4}

# ===== 服务商默认模型（数据库为空时的 fallback） =====
mimo:
  default-model: mimo-v2.5-pro

longcat:
  default-model: LongCat-Flash-Chat

sensenova:
  default-model: sensenova-6.7-flash-lite

deepseek:
  default-model: deepseek-v4-flash

kimi:
  default-model: kimi-k2.5